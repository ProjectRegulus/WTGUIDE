<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough Guide</title>
<style>
:root{--ink:#111;--g1:#444;--g2:#777;--g3:#bbb;--g4:#e6e6e6;--g5:#f4f4f4;--w:#fff;--r:6px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--w);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase}h1 small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--g2)}
h2{font-size:20px;margin:0 0 4px}h3{font-size:12px;margin:18px 0 6px;letter-spacing:.1em;text-transform:uppercase;color:var(--g1)}
.lead{color:var(--g1);margin:0 0 12px}.hint{font-size:12.5px;color:var(--g2)}
.steps{display:flex;gap:3px;margin:12px 0 4px}.steps button{flex:1;border:0;background:var(--g4);height:5px;border-radius:99px;padding:0}.steps button.done{background:var(--g1)}.steps button.on{background:var(--ink);height:7px}
.stepmeta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);margin-bottom:14px}
.btn{border:1px solid var(--ink);background:var(--w);border-radius:var(--r);padding:9px 16px;font-size:13px;font-weight:600;min-height:40px}.btn.d{background:var(--ink);color:var(--w)}.btn.sm{padding:5px 10px;font-size:12px;min-height:30px}.btn.ghost{border-color:var(--g4);color:var(--g1)}.btn:hover{background:var(--g5)}.btn.d:hover{background:#333}
input[type=text],textarea{width:100%;border:1px solid var(--g3);border-radius:var(--r);padding:9px 10px;background:var(--w)}textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.box{border:1px solid var(--g4);border-radius:var(--r);padding:14px;margin:10px 0}.box.dark{background:var(--ink);color:var(--w);border-color:var(--ink)}.box.dark .lbl{color:var(--g3)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g2);margin:0 0 4px}
.say{position:relative;border-left:2px solid var(--ink);padding:8px 90px 8px 14px;margin:8px 0;font-style:italic;background:var(--g5);border-radius:0 var(--r) var(--r) 0;white-space:pre-line}.say .copy{position:absolute;right:8px;top:8px}
.copy{border:1px solid var(--g3);background:var(--w);border-radius:4px;padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.06em;font-style:normal}.copy.ok{background:var(--ink);color:var(--w);border-color:var(--ink)}
.note{margin:14px 0;border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px}.note .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g2)}.note b.t{display:block;font-size:15px;margin:2px 0 6px}.note .ex{font-size:12.5px;color:var(--g2);margin:6px 0 0}.note .ex i{color:var(--g1)}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--g4);cursor:pointer;font-size:14px}.ck label:last-child{border-bottom:0}.ck input{width:18px;height:18px;margin-top:2px;accent-color:#111}.ck label.done span{color:var(--g2);text-decoration:line-through}
.q{margin:12px 0}.q .n{font-size:11px;letter-spacing:.12em;color:var(--g2);text-transform:uppercase}.rev{font-size:13px;color:var(--g1);margin:2px 0}.rev b{color:var(--ink)}
.choice{display:flex;flex-wrap:wrap;gap:6px}.choice button{border:1px solid var(--g3);background:var(--w);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}.choice button.on{background:var(--ink);color:var(--w);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);padding:6px 8px;border-bottom:1px solid var(--ink)}td{padding:8px;border-bottom:1px solid var(--g4);vertical-align:top}td:first-child{font-weight:600}
details{border-top:1px solid var(--g4)}details:last-of-type{border-bottom:1px solid var(--g4)}summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--g2);font-weight:400}details[open] summary:after{content:"–"}details .in{padding:0 0 12px;font-size:14px}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--w);border-top:1px solid var(--g4);padding:10px 16px;z-index:5}.footer .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}.timer.over{text-decoration:underline}
.sum{border:2px solid var(--ink);border-radius:var(--r);padding:14px 16px;background:var(--w);font-size:13.5px}.sum .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:8px}.sum .h b{font-size:14px;text-transform:uppercase;letter-spacing:.06em}.sum .h span{font-size:11px;color:var(--g2)}
.sum .i{display:grid;grid-template-columns:118px 1fr;gap:0 10px;padding:6px 0;border-bottom:1px solid var(--g4)}.sum .i:last-child{border:0}.sum .i b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);padding-top:2px}.sum .i span{white-space:pre-line}.sum .i span.miss{color:var(--g3);font-style:italic}
.flag{display:inline-block;border:1px solid var(--ink);border-radius:4px;padding:1px 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--w);padding:8px 14px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9}.toast.on{opacity:1}
@media(max-width:640px){.say{padding-right:14px;padding-bottom:40px}.say .copy{top:auto;bottom:8px}.sum .i{grid-template-columns:96px 1fr}}
@media print{.footer,header .row,.steps,.stepmeta,.btn,.lead{display:none}.wrap{padding:0}}
</style>
</head>

<div class="wrap">
<header><h1>Walkthrough Guide<small>Connect · Discover · Walk · Close</small></h1><div class="row"><input type="text" data-s="company" placeholder="Your company" style="width:150px" aria-label="Your company"><button class="btn sm ghost" id="lang">ES</button><button class="btn sm ghost" id="jump">Summary</button><button class="btn sm ghost" id="reset">New visit</button></div></header>
<div class="steps" id="steps"></div><div class="stepmeta"><span id="stepname"></span><span id="stepcount"></span></div>
<main id="main"></main>
</div>
<div class="footer"><div class="in"><button class="btn" id="back">← Back</button><span class="timer" id="timer" title="Tap to start / pause">00:00</span><button class="btn d" id="next">Next →</button></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="wtguide:v3";let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1200)};
const g=k=>(S[k]??"").toString().trim();
const say=t=>`<div class="say" data-tpl="${esc(t)}"></div>`;
const fill=t=>t.replace(/\{company\}/g,g("company")||"[Company]");
const Q=(n,s,r,l)=>`<div class="q"><div class="n">${n}</div>${say(s)}${r?`<div class="rev"><b>Reveals:</b> ${esc(r)}</div>`:""}${l?`<div class="rev"><b>Listen for:</b> ${esc(l)}</div>`:""}</div>`;
const NOTE=(id,n,t,ex)=>`<div class="note"><div class="n">${n}</div><b class="t">${t}</b><textarea data-s="${id}" placeholder="${esc(ex)}">${esc(g(id))}</textarea><div class="ex">Example: <i>${esc(ex)}</i></div></div>`;
const CK=(id,items)=>`<div class="ck" data-ck="${id}">${items.map((t,i)=>`<label class="${(S["ck_"+id]||[]).includes(i)?"done":""}"><input type="checkbox" ${(S["ck_"+id]||[]).includes(i)?"checked":""}><span>${t}</span></label>`).join("")}</div>`;
const SERVICES=["Recurring janitorial","Day porter","Deep clean / initial","Floor care (strip & wax / scrub)","Carpet cleaning","Window cleaning","Pressure washing","Post-construction","Disinfection / high-touch","Restroom sanitation program","Kitchen / break room detail","Emergency / on-call"];

const TR={"Summary": "Resumen", "New visit": "Nueva visita", "Prepare": "Preparar", "Connect": "Conectar", "Discover": "Descubrir", "Walk": "Recorrer", "Close": "Cerrar", "Before the meeting": "Antes de la reunión", "A walkthrough without preparation is an inspection. Know the client before you shake hands — and read the building before the walkthrough starts.": "Un walkthrough sin preparación es una inspección. Conoce al cliente antes de dar la mano — y lee el edificio antes de que empiece el recorrido.", "Research · the night before": "Investigación · la noche anterior", "<b>Commercial? Review their website.</b> What they do, how many locations, who runs operations, recent news (new location, expansion, award).": "<b>¿Comercial? Revisa su sitio web.</b> Qué hacen, cuántas ubicaciones, quién maneja operaciones, noticias recientes (nueva ubicación, expansión, premio).", "<b>Is there a vendor process on the site?</b> Look for Vendors / Suppliers / Procurement / Become a vendor. If there is one, know it before they mention it.": "<b>¿Hay un proceso de vendors en el sitio?</b> Busca Vendors / Suppliers / Procurement / Become a vendor. Si existe, conócelo antes de que lo mencionen.", "<b>Review their needs</b> from the first call: why they reached out, what they asked for, who decides, start date.": "<b>Revisa sus necesidades</b> de la primera llamada: por qué contactaron, qué pidieron, quién decide, fecha de inicio.", "<b>Know something about the client:</b> LinkedIn of the person you're meeting, Google reviews, how long in business.": "<b>Conoce algo del cliente:</b> LinkedIn de la persona con quien te reúnes, reseñas de Google, años en el negocio.", "<b>Review the address</b> — parking, entrance, which suite. Confirm by text the day before.": "<b>Revisa la dirección</b> — estacionamiento, entrada, qué suite. Confirma por texto el día anterior.", "<b>Know your approved pricing</b> for this property type so you can close on site if the scope is clear.": "<b>Conoce tu precio aprobado</b> para este tipo de propiedad para poder cerrar en sitio si el alcance está claro.", "On site · 15 minutes early": "En sitio · 15 minutos antes", "<b>Arrive 15 minutes before.</b> Look at the building from outside: parking lot, sidewalks, entrance glass, dumpsters.": "<b>Llega 15 minutos antes.</b> Mira el edificio desde afuera: estacionamiento, aceras, vidrio de la entrada, dumpsters.", "<b>Walk in as a visitor first.</b> Door mats, lobby floor, fingerprints on glass, dust on ledges and top shelves — the space tells you the standard before anyone speaks.": "<b>Entra primero como visitante.</b> Tapetes, piso del lobby, huellas en el vidrio, polvo en repisas y estantes altos — el espacio te dice el estándar antes de que alguien hable.", "<b>Use the restroom.</b> Odor, dispensers, floor corners, top of partitions. Restrooms are what tenants complain about.": "<b>Usa el baño.</b> Olor, dispensadores, esquinas del piso, parte superior de las divisiones. Los baños son de lo que se quejan los inquilinos.", "<b>Look up.</b> Vents, high ledges, light fixtures, window sills — what the current provider skips.": "<b>Mira hacia arriba.</b> Rejillas, repisas altas, lámparas, marcos de ventana — lo que el proveedor actual se salta.", "<b>Form one hypothesis:</b> “I think the real problem is ___.” The conversation confirms or corrects it.": "<b>Forma una hipótesis:</b> “Creo que el problema real es ___.” La conversación la confirma o la corrige.", "Words to use — and industry language": "Palabras que usar — y lenguaje por industria", "Say": "Di", "Instead of": "En vez de", "Industry": "Industria", "Terms you must know": "Términos que debes conocer", "Construction / GC": "Construcción / GC", "Property management": "Administración de propiedades", "Office / corporate": "Oficina / corporativo", "Medical / dental": "Médico / dental", "Hospitality / retail": "Hospitalidad / retail", "Industrial / warehouse": "Industrial / bodega", "Rule": "Regla", "Never walk in cold. If you can name their vendor process, their second location and their last review, you're already the most prepared vendor they've met.": "Nunca entres en frío. Si puedes nombrar su proceso de vendors, su segunda ubicación y su última reseña, ya eres el vendor más preparado que han conocido.", "← Back": "← Atrás", "Next →": "Siguiente →", "Summary →": "Resumen →", "Done ✓": "Listo ✓", "The first two minutes decide the visit": "Los primeros dos minutos deciden la visita", "People buy from people they trust. Before any question about cleaning: notice something real, use their name, match their pace, and thank them for time you know is limited. Then explain why you'll ask questions — so it feels like a consultation, not an inspection.": "La gente compra a quien le tiene confianza. Antes de cualquier pregunta sobre limpieza: nota algo real, usa su nombre, iguala su ritmo y agradece un tiempo que sabes que es limitado. Después explica por qué harás preguntas — para que se sienta como asesoría, no como inspección.", "Timer": "Cronómetro", "Start it when you walk in. Target: 15–17 minutes. Person → story → space → two dates. You talk 20%.": "Inícialo al entrar. Meta: 15–17 minutos. Persona → historia → espacio → dos fechas. Tú hablas 20%.", "Start timer": "Iniciar", "Running": "Corriendo", "Open": "Apertura", "Notice something real": "Nota algo real", "Examples": "Ejemplos", "The space": "El espacio", "The business": "El negocio", "The person": "La persona", "The referral": "El referido", "Get to know the person": "Conoce a la persona", "Question 1": "Pregunta 1", "Question 2 · why now": "Pregunta 2 · por qué ahora", "Question 3 · magic wand": "Pregunta 3 · varita mágica", "Question 4": "Pregunta 4", "<b>Reveals:</b> Authority and tenure without asking “are you the decision maker?”.": "<b>Revela:</b> autoridad y antigüedad sin preguntar “¿es usted quien decide?”.", "<b>Listen for:</b> “I make that call” = high authority · “I'd have to run it by…” = shared. If someone else is named, they join the proposal review.": "<b>Escucha por:</b> “I make that call” = autoridad alta · “I'd have to run it by…” = compartida. Si nombran a alguien más, esa persona entra a la revisión de la propuesta.", "Note 1 of 5": "Nota 1 de 5", "Note 2 of 5": "Nota 2 de 5", "Note 3 of 5": "Nota 3 de 5", "Note 4 of 5": "Nota 4 de 5", "Note 5 of 5": "Nota 5 de 5", "Client info": "Información del cliente", "Why they're looking / what happened with the previous provider": "Por qué buscan / qué pasó con el proveedor anterior", "Main priorities (in their order)": "Prioridades principales (en su orden)", "Details of the service they want": "Detalles del servicio que quieren", "General notes about the opportunity": "Notas generales de la oportunidad", "Ask, then be quiet — count to four. Keywords, not sentences. Never read from a form.": "Pregunta y calla — cuenta hasta cuatro. Palabras clave, no oraciones. Nunca leas de un formulario.", "Let them tell the story": "Deja que cuenten la historia", "Open questions in layers: one question that invites a story replaces four closed ones. Listen fully; write keywords.": "Preguntas abiertas en capas: una pregunta que invita a una historia reemplaza cuatro cerradas. Escucha completo; anota palabras clave.", "<b>Reveals:</b> The real reason, the frustration with the current provider, a hidden deadline.": "<b>Revela:</b> el motivo real, la frustración con el proveedor actual, una fecha límite oculta.", "<b>Listen for:</b> Usually the longest, most honest answer of the visit. Don't interrupt.": "<b>Escucha por:</b> suele ser la respuesta más larga y honesta de la visita. No interrumpas.", "Go one level deeper — examples": "Profundiza un nivel — ejemplos", "Follow-ups — examples": "Seguimientos — ejemplos", "<b>Reveals:</b> A concrete, prioritized list.": "<b>Revela:</b> una lista concreta y priorizada.", "<b>Listen for:</b> The first two are what closes. The order matters more than the list.": "<b>Escucha por:</b> las dos primeras son las que cierran. El orden importa más que la lista.", "Before you walk — confirm": "Antes de recorrer — confirma", "Now walk — you know what to look for": "Ahora recorre — ya sabes qué buscar", "Mostly observation: measure, check, photograph. Two questions only. Everything the quote needs goes in one note.": "Sobre todo observación: mide, revisa, fotografía. Solo dos preguntas. Todo lo que necesita la cotización va en una nota.", "<b>Reveals:</b> Priority zones and the standard expected there.": "<b>Revela:</b> zonas prioritarias y el estándar esperado en ellas.", "What the quote needs": "Lo que necesita la cotización", "Capture": "Captura", "Look for": "Busca", "Size &amp; layout": "Tamaño y distribución", "Sq ft, floors, bathrooms (count), kitchens, offices vs. open space": "Sq ft, pisos, baños (cantidad), cocinas, oficinas vs. espacio abierto", "Floors": "Pisos", "VCT / carpet / tile / concrete and condition — floor care as an option, not a surprise": "VCT / alfombra / cerámica / concreto y condición — floor care como opción, no como sorpresa", "Frequency &amp; window": "Frecuencia y horario", "Days per week, after-hours or day porter, start date": "Días por semana, after-hours o day porter, fecha de inicio", "Access &amp; supplies": "Acceso y suministros", "Keys, code, alarm, on-site contact; who provides paper, soap, bags; closet": "Llaves, código, alarma, contacto en sitio; quién provee papel, jabón, bolsas; bodega", "Condition": "Condición", "1–5. Restroom odor, grease, dust on high surfaces, corners, baseboards": "1–5. Olor en baños, grasa, polvo en superficies altas, esquinas, zócalos", "Special": "Especial", "Server room, lab, gym, exterior glass, parking — hazards and restricted areas": "Sala de servidores, laboratorio, gimnasio, vidrio exterior, estacionamiento — peligros y áreas restringidas", "While walking": "Durante el recorrido", "Walk at their pace. When they point at a problem, reflect it: “So this is one of the areas that's been frustrating.” Never criticize the current provider. Promise nothing operations hasn't approved.": "Camina a su ritmo. Cuando señalen un problema, refléjalo: “So this is one of the areas that's been frustrating.” Nunca critiques al proveedor actual. No prometas nada que operaciones no haya aprobado.", "Leave with a result — always": "Sal con un resultado — siempre", "Close on site when the scope is clear and you know your approved pricing. Otherwise leave with two dates. If it's not now, leave with the seed of a future win. Never “I'll be in touch.”": "Cierra en sitio cuando el alcance está claro y conoces tu precio aprobado. Si no, sal con dos fechas. Si no es ahora, sal con la semilla de una venta futura. Nunca “I'll be in touch.”", "If they push back — Feel · Felt · Found": "Si hay objeción — Feel · Felt · Found", "Techniques — examples": "Técnicas — ejemplos", "Technique": "Técnica", "Example": "Ejemplo", "Labeling": "Labeling (etiquetar)", "Mirroring": "Mirroring (espejo)", "Silence": "Silencio", "Summarize": "Resumir", "Ask, count to four. The next thing they say is usually the truth.": "Pregunta, cuenta hasta cuatro. Lo siguiente que dicen suele ser la verdad.", "Closing — examples": "Cierres — ejemplos", "Two options": "Dos opciones", "Assumptive": "Asumido", "Real scarcity": "Escasez real", "Summary close": "Cierre resumen", "Trial close": "Cierre de prueba", "Not now? Plant the future win": "¿No es ahora? Siembra la venta futura", "Two services to offer": "Dos servicios para ofrecer", "Pick the two that solve what they named or what you saw. Not a service list — a recommendation.": "Elige los dos que resuelven lo que nombraron o lo que viste. No una lista de servicios — una recomendación.", "Outcome": "Resultado", "Closed on site": "Cerrado en sitio", "Proposal + review call set": "Propuesta + llamada de revisión agendada", "Follow-up date set": "Fecha de seguimiento fijada", "Not now — renewal noted": "No por ahora — renovación anotada", "Visit summary": "Resumen de la visita", "One screenshot. Send it to whoever writes the proposal.": "Una captura. Envíala a quien escribe la propuesta.", "Copy as text": "Copiar como texto", "Print / PDF": "Imprimir / PDF", "Client": "Cliente", "Why looking": "Por qué buscan", "Priorities": "Prioridades", "Service wanted": "Servicio deseado", "Offer": "Ofrecer", "Notes": "Notas", "Outcome not set": "Sin resultado", "on site": "en sitio", "Other / detail (e.g. quarterly floor care + weekly photo report)": "Otro / detalle (ej. floor care trimestral + reporte semanal con fotos)", "Your company": "Tu empresa", "Example:": "Ejemplo:"};
function tr(k){return S.lang==="es"&&TR[k]!=null?TR[k]:k}
function applyLang(){const es=S.lang==="es";$("#lang").textContent=es?"EN":"ES";if(!es)return;
 const els=$$("h2,h3,p.lead,.lbl,.n,b.t,th,td,.ck span,summary,.rev,.hint,.box,.note .ex,.sum .i b,.sum .h span,.footer button,header button,textarea,.choice[data-c] button,.flag,#stepname,.btn");
 els.forEach(el=>{if(el.closest(".say"))return;if(el.tagName==="TEXTAREA"){if(TR[el.placeholder])el.placeholder=TR[el.placeholder];return}if(el.tagName==="INPUT"){if(TR[el.placeholder])el.placeholder=TR[el.placeholder];return}
  const h=el.innerHTML.trim();if(TR[h]){el.innerHTML=TR[h];return}
  el.childNodes.forEach(n=>{if(n.nodeType===3){const t=n.textContent.trim();if(TR[t])n.textContent=n.textContent.replace(t,TR[t])}});
  if(el.classList.contains("ex")&&el.firstChild&&el.firstChild.nodeType===3)el.firstChild.textContent=el.firstChild.textContent.replace("Example:",TR["Example:"])});
 $$("input[type=text]").forEach(i=>{if(TR[i.placeholder])i.placeholder=TR[i.placeholder]});

const STEPS=[
{id:"prepare",name:"Prepare",render:()=>`<h2>Before the meeting</h2><p class="lead">A walkthrough without preparation is an inspection. Know the client before you shake hands — and read the building before the walkthrough starts.</p>
 <h3>Research · the night before</h3>${CK("research",["<b>Commercial? Review their website.</b> What they do, how many locations, who runs operations, recent news (new location, expansion, award).","<b>Is there a vendor process on the site?</b> Look for Vendors / Suppliers / Procurement / Become a vendor. If there is one, know it before they mention it.","<b>Review their needs</b> from the first call: why they reached out, what they asked for, who decides, start date.","<b>Know something about the client:</b> LinkedIn of the person you're meeting, Google reviews, how long in business.","<b>Review the address</b> — parking, entrance, which suite. Confirm by text the day before.","<b>Know your approved pricing</b> for this property type so you can close on site if the scope is clear."])}
 <h3>On site · 15 minutes early</h3>${CK("onsite",["<b>Arrive 15 minutes before.</b> Look at the building from outside: parking lot, sidewalks, entrance glass, dumpsters.","<b>Walk in as a visitor first.</b> Door mats, lobby floor, fingerprints on glass, dust on ledges and top shelves — the space tells you the standard before anyone speaks.","<b>Use the restroom.</b> Odor, dispensers, floor corners, top of partitions. Restrooms are what tenants complain about.","<b>Look up.</b> Vents, high ledges, light fixtures, window sills — what the current provider skips.","<b>Form one hypothesis:</b> “I think the real problem is ___.” The conversation confirms or corrects it."])}
 <details><summary>Words to use — and industry language</summary><div class="in">
 <table><tr><th>Say</th><th>Instead of</th></tr><tr><td>partnership · collaborate · contribute</td><td>sell you · our services</td></tr><tr><td>approved vendor · vendor process</td><td>get the job</td></tr><tr><td>scope · frequency · standard</td><td>stuff we clean</td></tr><tr><td>walkthrough · site visit</td><td>look around</td></tr><tr><td>point of contact · inspection · report</td><td>call us if there's a problem</td></tr><tr><td>“What would success look like?”</td><td>“What do you need?”</td></tr></table>
 <table><tr><th>Industry</th><th>Terms you must know</th></tr><tr><td>Construction / GC</td><td>rough clean · final clean · touch-up (fluff) clean · punch list · substantial completion · CO (certificate of occupancy) · superintendent · change order · phases · debris removal</td></tr><tr><td>Property management</td><td>turnover · make-ready · move-in / move-out · unit inspection · common areas · vacancy · work order · CAM (common area maintenance) · leasing office · regional manager</td></tr><tr><td>Office / corporate</td><td>facilities manager · janitorial · day porter · after-hours · badge access · consumables · KPI / SLA</td></tr><tr><td>Medical / dental</td><td>terminal clean · high-touch disinfection · compliance · exam rooms · biohazard (not ours) · OSHA</td></tr><tr><td>Hospitality / retail</td><td>front of house / back of house · opening / closing · guest-facing · floor care program</td></tr><tr><td>Industrial / warehouse</td><td>safety protocol · PPE · dock · scrubber · pressure washing · shift schedule</td></tr></table></div></details>
 <div class="box"><div class="lbl">Rule</div>Never walk in cold. If you can name their vendor process, their second location and their last review, you're already the most prepared vendor they've met.</div>`},
{id:"connect",name:"Connect",render:()=>`<h2>The first two minutes decide the visit</h2><p class="lead">People buy from people they trust. Before any question about cleaning: notice something real, use their name, match their pace, and thank them for time you know is limited. Then explain why you'll ask questions — so it feels like a consultation, not an inspection.</p>
 <div class="box dark" id="tbox"><div class="lbl">Timer</div>Start it when you walk in. Target: 15–17 minutes. Person → story → space → two dates. You talk 20%. </div>
 <h3>Open</h3>${say("Hi [Name], thank you for taking the time today — I know it's limited, so I'll make it count.")}
 <table><tr><th>Notice something real</th><th>Examples</th></tr><tr><td>The space</td><td>“This lobby is beautiful — how long have you been in this building?”</td></tr><tr><td>The business</td><td>“Looks like a busy morning. Is it always like this?”</td></tr><tr><td>The person</td><td>“I saw the team photos on the wall — how big is the crew here?”</td></tr><tr><td>The referral</td><td>“[Referrer] said you've been dealing with missed days — I'm glad we could meet.”</td></tr></table>
 ${say("I'm with {company}. Before we walk the facility, I'd like a few minutes to understand your business and what's most important to you. Every facility runs differently, so rather than a standard presentation, I'd rather learn your goals — then as we walk, we focus on what matters to you.")}
 <h3>Get to know the person</h3>${Q("Question 1","So, what's your role here, and how long have you been with the company?","Authority and tenure without asking “are you the decision maker?”.","“I make that call” = high authority · “I'd have to run it by…” = shared. If someone else is named, they join the proposal review.")}
 ${say("Before we dive in — is it just you I'll be talking to about this, or is there anyone else who should be part of the conversation?")}
 ${NOTE("n1","Note 1 of 5","Client info","Dana Smith, ops manager 6 yrs, decides with owner Mike. Direct, busy. Referral from Riverside PM. Mentioned a rough audit last month.")}
 <div class="box"><div class="lbl">Rule</div>Ask, then be quiet — count to four. Keywords, not sentences. Never read from a form.</div>`},
{id:"questions",name:"Questions",render:()=>`<h2>Useful questions</h2><p class="lead">Open questions in layers: one question that invites a story replaces four closed ones. Ask, then be quiet. Write keywords.</p>
 ${Q("Question 2 · why now","What made you decide to start looking at other options now?","The real reason, the frustration with the current provider, a hidden deadline.","Usually the longest, most honest answer of the visit. Don't interrupt.")}
 <details><summary>Go one level deeper — examples</summary><div class="in">${say("How often has that been happening?")}${say("How has that affected your team — complaints, extra work?")}${say("What would it mean for you if that were solved?")}${say("When does your current agreement come up for renewal?")}</div></details>
 ${NOTE("n2","Note 2 of 5","Why they're looking / what happened with the previous provider","Provider missing 1–2 nights a week for 3 months, no answer when they call. Contract month-to-month, ends any time. Patients complained about restrooms twice.")}
 ${Q("Question 3 · magic wand","If you could wave a magic wand and fix three things about how your space is cleaned today, what would they be?","A concrete, prioritized list.","The first two are what closes. The order matters more than the list.")}
 <details><summary>Follow-ups — examples</summary><div class="in">${say("What would a great partnership with a cleaning company look like, day to day?")}${say("Walk me through how a decision like this usually happens here — who's involved, and what's the timeline?")}${say("Anything else going on — upcoming events, inspections, other locations?")}</div></details>
 ${NOTE("n3","Note 3 of 5","Main priorities (in their order)","1. Restrooms spotless every night · 2. Someone answers when they call · 3. Consistent crew. Wants weekly photo report. Decision by Oct 1, budget “around what we pay now”. Second clinic opening in spring.")}
 <h3>During the walk</h3>${Q("Question 4","Which areas get the most traffic, or need the most attention?","Priority zones and the standard expected there.","")}${say("Anything back here I should know about — chemicals, secure areas, equipment we need to be careful around?")}
 <h3>If price comes up</h3>${say("That's helpful — how do you normally evaluate pricing for this type of service, and is there a range you're working with?")}
 <div class="box"><div class="lbl">Before you walk — confirm</div>“Just to make sure I understand: the main issue is ___, what matters most is ___, and you'd like to start by ___. Is that right?”</div>`},
{id:"walk",name:"Walk",render:()=>`<h2>Now walk — you know what to look for</h2><p class="lead">Mostly observation: measure, check, photograph. Everything the quote needs goes in one note.</p>
 <h3>What the quote needs</h3><table><tr><th>Capture</th><th>Look for</th></tr><tr><td>Size &amp; layout</td><td>Sq ft, floors, bathrooms (count), kitchens, offices vs. open space</td></tr><tr><td>Floors</td><td>VCT / carpet / tile / concrete and condition — floor care as an option, not a surprise</td></tr><tr><td>Frequency &amp; window</td><td>Days per week, after-hours or day porter, start date</td></tr><tr><td>Access &amp; supplies</td><td>Keys, code, alarm, on-site contact; who provides paper, soap, bags; closet</td></tr><tr><td>Condition</td><td>1–5. Restroom odor, grease, dust on high surfaces, corners, baseboards</td></tr><tr><td>Special</td><td>Server room, lab, gym, exterior glass, parking — hazards and restricted areas</td></tr></table>
 ${NOTE("n4","Note 4 of 5","Details of the service they want","Recurring janitorial 5x/week after 6pm · ~8,000 sq ft, 1 floor, 6 restrooms, 1 break room · VCT worn in hallway, carpet in offices · they supply paper, we bring the rest · key + alarm code · start Oct 1 · condition 3/5 · 12 photos.")}
 <div class="box"><div class="lbl">While walking</div>Walk at their pace. When they point at a problem, reflect it: “So this is one of the areas that's been frustrating.” Never criticize the current provider. Promise nothing operations hasn't approved.</div>`},
{id:"objections",name:"Objections",render:()=>`<h2>Overcome objections — Feel · Felt · Found</h2><p class="lead">An objection is a request for more information. Listen fully, acknowledge how they <b>feel</b>, share that others <b>felt</b> the same, tell them what those clients <b>found</b>. Confirm — “Does that make sense?” — then advance. Never argue, never drop the price to “resolve” it.</p>
 <h3>Objections — examples</h3>
 ${[["“Your price is probably higher than what we pay.”","I understand how you feel. Several of our clients felt the same way at first. What they found was that reliability and one point of contact saved them the problems they were having. Can I ask what's included in what you pay today?"],["“We already have a company.”","That makes sense — most of our clients had a provider before us. What they found was that having a second option ready when the agreement came up saved a lot of stress. When does yours come up for renewal?"],["“I need to talk to my partner.”","Of course — it sounds like you want to make the best long-term decision. What would they want to see? I'm happy to join a quick call with both of you."],["“Can you give me a number right now?”","I'd rather give you an accurate number than a guess. I'll have it by [day]. So it's right: is there a range you're working with?"]].map(([o,r])=>`<details><summary>${esc(o)}</summary><div class="in">${say(r)}</div></details>`).join("")}
 <h3>Techniques — examples</h3><table><tr><th>Technique</th><th>Example</th></tr><tr><td>Labeling</td><td>“It sounds like consistency is the real issue here.” · “It seems your biggest concern is not repeating last year.”</td></tr><tr><td>Mirroring</td><td>They: “We've had a lot of issues with communication.” You: “Communication?” — then silence. They elaborate.</td></tr><tr><td>Silence</td><td>Ask, count to four. The next thing they say is usually the truth.</td></tr><tr><td>Summarize</td><td>“So: restrooms, response time, same crew — in that order. Did I get it right?”</td></tr></table>
`},
{id:"close",name:"Close",render:()=>`<h2>Leave with a result — always</h2><p class="lead">Close on site when the scope is clear and you know your approved pricing. Otherwise leave with two dates. If it's not now, leave with the seed of a future win. Never “I'll be in touch.”</p>
 <h3>Closing — examples</h3><table><tr><th>Close</th><th>Say</th></tr><tr><td>Two options</td><td>“Would Tuesday or Thursday work better to get started?” · “Morning or evening schedule?”</td></tr><tr><td>Assumptive</td><td>“The next step is a quick proposal review Friday — I'll bring the service agreement so we can lock the start date.”</td></tr><tr><td>Real scarcity</td><td>“Our night crew for this area has one opening in October. If Oct 1 matters, let's hold it today.” — only when true.</td></tr><tr><td>Summary close</td><td>“You need spotless restrooms, someone who answers, and the same crew. That's exactly what we set up. Shall we start Oct 1?”</td></tr><tr><td>Trial close</td><td>“If the proposal reflects everything we discussed, is there anything that would keep you from moving forward?”</td></tr></table>
 <h3>Close</h3>${say("Based on everything we've seen, we can certainly help. Would you prefer a morning or evening schedule, and would [day] or the following week work better to get started?")}${say("Here's what happens next: I'll put together a proposal based on exactly what you shared, and I'll have it to you by [day]. Would [day/time] or [day/time] work better for a quick call to go over it together?")}
 <h3>Not now? Plant the future win</h3>${say("When does your current agreement come up for renewal? Would it be alright if I reached back out a month or two before that? — And if you know another property manager dealing with the same issues, we'd love an introduction.")}
 <h3>Two services to offer</h3><p class="hint">Pick the two that solve what they named or what you saw. Not a service list — a recommendation.</p><div class="choice" id="svc">${SERVICES.map(s=>`<button data-v="${esc(s)}" class="${(S.svc||[]).includes(s)?"on":""}">${esc(s)}</button>`).join("")}</div><input type="text" data-s="svc_other" placeholder="Other / detail (e.g. quarterly floor care + weekly photo report)" style="margin-top:8px" value="${esc(g("svc_other"))}">
 <h3>Outcome</h3><div class="choice" data-c="outcome">${["Closed on site","Proposal + review call set","Follow-up date set","Not now — renewal noted"].map(o=>`<button data-v="${esc(o)}" class="${g("outcome")===o?"on":""}">${o}</button>`).join("")}</div>
 ${NOTE("n5","Note 5 of 5","General notes about the opportunity","Proposal by Thu, review call Fri 2pm with Dana + Mike. Objection: price — they pay 3 nights not 5, compare scope. Promised: weekly photo report, same crew. Renewal: month-to-month. Second clinic in spring. Close probability 70%.")}`},
{id:"summary",name:"Summary",render:()=>{const miss=k=>!g(k);const item=(k,l)=>`<div class="i"><b>${l}</b><span class="${miss(k)?"miss":""}">${esc(g(k)||"—")}</span></div>`;const sv=[...(S.svc||[]),g("svc_other")].filter(Boolean).join(" · ");
 return `<h2>Visit summary</h2><p class="lead">One screenshot. Send it to whoever writes the proposal.</p><div class="row" style="margin-bottom:10px"><button class="btn d" id="cp">Copy as text</button></div>
 <div class="sum" id="card"><div class="h"><b>${esc(g("company")||"Walkthrough")} · Walkthrough</b><span>${new Date().toLocaleDateString()} · ${fmt(S.elapsed||0)} ${tr("on site")}</span></div>
 <div style="margin-bottom:6px">${g("outcome")?`<span class="flag">${esc(g("outcome"))}</span>`:`<span class="flag" style="border-style:dashed">Outcome not set</span>`}</div>
 ${item("n1","Client")}${item("n2","Why looking")}${item("n3","Priorities")}${item("n4","Service wanted")}<div class="i"><b>Offer</b><span class="${sv?"":"miss"}">${esc(sv||"—")}</span></div>${item("n5","Notes")}</div>`}}];

function summaryText(){const sv=[...(S.svc||[]),g("svc_other")].filter(Boolean).join(" · ");const T=tr;return[`${g("company")||"WALKTHROUGH"} — WALKTHROUGH ${T("Summary").toUpperCase()} · ${new Date().toLocaleDateString()} · ${fmt(S.elapsed||0)} ${T("on site")}`,`${T("Outcome").toUpperCase()}: ${tr(g("outcome"))||"—"}`,"",`${T("Client").toUpperCase()}: ${g("n1")||"—"}`,"",`${T("Why looking").toUpperCase()}: ${g("n2")||"—"}`,"",`${T("Priorities").toUpperCase()}: ${g("n3")||"—"}`,"",`${T("Service wanted").toUpperCase()}: ${g("n4")||"—"}`,"",`${T("Offer").toUpperCase()}: ${sv||"—"}`,"",`${T("Notes").toUpperCase()}: ${g("n5")||"—"}`].join("\n")}
S.step=S.step||0;S.elapsed=S.elapsed||0;let running=false,last=0,tick=null;
const fmt=ms=>{const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
function updTimer(){const el=$("#timer");el.textContent=(running?"● ":"")+fmt(S.elapsed);el.classList.toggle("over",S.elapsed>17*60000)}
function startTimer(){if(running)return;running=true;last=Date.now();tick=setInterval(()=>{const n=Date.now();S.elapsed+=n-last;last=n;save();updTimer()},500);updTimer()}
function stopTimer(){running=false;clearInterval(tick);updTimer()}
$("#timer").onclick=()=>running?stopTimer():startTimer();
async function copyTxt(t){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(x){}ta.remove()}}
function renderSays(){$$(".say[data-tpl]").forEach(el=>{const t=fill(el.dataset.tpl);el.innerHTML=esc(t)+`<button class="copy" data-copy="${esc(t)}">COPY</button>`})}
function render(){const st=STEPS[S.step];$("#steps").innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${i<S.step?"done":""} ${i===S.step?"on":""}" title="${s.name}" aria-label="${s.name}"></button>`).join("");$("#stepname").textContent=`${S.step+1} · ${st.name}`;$("#stepcount").textContent=`${S.step+1} / ${STEPS.length}`;
 $("#main").innerHTML=st.render();renderSays();$("#back").style.visibility=S.step?"visible":"hidden";$("#next").textContent=S.step===STEPS.length-1?"Done ✓":(S.step===STEPS.length-2?"Summary →":"Next →");
 if(st.id==="connect"){const b=document.createElement("button");b.className="btn sm";b.textContent=tr(running?"Running":"Start timer");b.onclick=()=>{startTimer();b.textContent=tr("Running")};$("#tbox").appendChild(b)}
 if(st.id==="summary"){$("#cp").onclick=async()=>{await copyTxt(summaryText());toast("Copied")};if(running)stopTimer()}
 applyLang();window.scrollTo(0,0);save()}
document.addEventListener("click",async e=>{const c=e.target.closest(".copy");if(c){await copyTxt(c.dataset.copy);c.textContent="COPIED";c.classList.add("ok");setTimeout(()=>{c.textContent="COPY";c.classList.remove("ok")},1200);return}
 const sv=e.target.closest("#svc button");if(sv){const v=sv.dataset.v;S.svc=S.svc||[];if(S.svc.includes(v))S.svc=S.svc.filter(x=>x!==v);else{if(S.svc.length>=2)S.svc.shift();S.svc.push(v)}save();$$("#svc button").forEach(b=>b.classList.toggle("on",S.svc.includes(b.dataset.v)));return}
 const ch=e.target.closest(".choice[data-c] button");if(ch){S[ch.parentElement.dataset.c]=ch.dataset.v;save();ch.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===ch));return}
 const sb=e.target.closest("#steps button");if(sb){S.step=+sb.dataset.i;render()}});
document.addEventListener("change",e=>{const ck=e.target.closest(".ck");if(!ck||!e.target.matches("input"))return;S["ck_"+ck.dataset.ck]=[...ck.querySelectorAll("input")].map((x,i)=>x.checked?i:-1).filter(i=>i>=0);save();ck.querySelectorAll("label").forEach(l=>l.classList.toggle("done",l.querySelector("input").checked))});
document.addEventListener("input",e=>{const k=e.target.dataset.s;if(!k)return;S[k]=e.target.value;save();if(k==="company")renderSays()});
$("#next").onclick=()=>{if(S.step<STEPS.length-1){S.step++;render()}else toast("Saved in this browser")};
$("#back").onclick=()=>{if(S.step>0){S.step--;render()}};
$("#lang").onclick=()=>{S.lang=S.lang==="es"?"en":"es";save();render()};
$("#jump").onclick=()=>{S.step=STEPS.length-1;render()};
$("#reset").onclick=()=>{if(!confirm("Start a new visit? Notes will be cleared (company name kept)."))return;stopTimer();S={company:S.company,lang:S.lang,step:0,elapsed:0};save();render();toast(tr("New visit"))};
const ci=$('[data-s="company"]');ci.value=g("company");render();updTimer();
</script>
</body>
</html>
