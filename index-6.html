<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough & Meeting Guide</title>
<style>
:root{--ink:#111;--g1:#3d3d3d;--g2:#757575;--g3:#c4c4c4;--g4:#e8e8e8;--g5:#f5f5f5;--w:#fff;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--w);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:18px 18px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--g4)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--g2);letter-spacing:0}
.hbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--g4);background:var(--w);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;min-height:36px}
.pill:hover{background:var(--g5)}
.pill.dark{background:var(--ink);color:var(--w);border-color:var(--ink)}
.pill.dark:hover{background:#2a2a2a}
.steps{display:flex;gap:4px;margin:16px 0 6px}
.steps button{flex:1;border:0;background:var(--g4);height:6px;border-radius:99px;padding:0}
.steps button.done{background:#8a8a8a}
.steps button.on{background:var(--ink)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--g2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);margin:26px 0 10px;font-weight:600}
.lead{color:var(--g1);margin:0 0 14px;font-size:15.5px}
.hint{font-size:13px;color:var(--g2)}
.card{border:1px solid var(--g4);border-radius:var(--r);padding:16px 18px;margin:10px 0;background:var(--w)}
.card.soft{background:var(--g5);border-color:var(--g5)}
.card.dark{background:var(--ink);color:var(--w);border-color:var(--ink)}
.card.dark .hint,.card.dark .lab{color:#b5b5b5}
.card.dark .pill{color:var(--ink);background:var(--w);border-color:var(--w)}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);font-weight:600;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{position:relative;background:var(--g5);border-radius:12px;padding:12px 92px 12px 14px;margin:8px 0;font-size:14.5px;white-space:pre-line}
.say .who{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);font-weight:600;margin-bottom:2px}
.say.them{background:var(--w);border:1px solid var(--g4)}
.copy{position:absolute;right:10px;top:10px;border:1px solid var(--g3);background:var(--w);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600}
.copy.ok{background:var(--ink);color:var(--w);border-color:var(--ink)}
.rev{font-size:13.5px;color:var(--g1);margin:3px 0 0 2px}
.rev b{color:var(--ink)}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
.ck label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--g4);cursor:pointer}
.ck label:last-child{border-bottom:0}
.ck input{width:20px;height:20px;margin-top:1px;accent-color:#111;flex:none}
.ck label.done span{color:var(--g2);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);padding:8px 10px;border-bottom:1px solid var(--ink);font-weight:600}
td{padding:10px;border-bottom:1px solid var(--g4);vertical-align:top}
td:first-child{font-weight:600}
.tscroll{overflow-x:auto}
details{border-bottom:1px solid var(--g4)}
details:first-of-type{border-top:1px solid var(--g4)}
summary{cursor:pointer;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--g2);font-weight:400;font-size:18px;line-height:1}
details[open] summary:after{content:"–"}
details .in{padding:0 0 14px}
.niches{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.niches.three{grid-template-columns:repeat(3,1fr)}
.niche{text-align:left;border:1px solid var(--g4);background:var(--w);border-radius:var(--r);padding:16px}
.niche:hover{border-color:var(--g3)}
.niche.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.niche b{display:block;font-size:15.5px;margin-bottom:3px}
.niche span{font-size:13px;color:var(--g2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--g3);background:var(--w);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--w);border-color:var(--ink)}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--g1);margin-bottom:5px;font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--g3);border-radius:12px;padding:11px 12px;background:var(--w)}
textarea{min-height:92px;resize:vertical}
.note{border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 16px;margin:16px 0}
.note .n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);font-weight:600}
.note b.t{display:block;font-size:16px;margin:2px 0 8px}
.note .ex{font-size:12.5px;color:var(--g2);margin-top:8px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:24px;font-weight:700;letter-spacing:-.02em}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--g4);padding:10px 18px;z-index:5}
.foot .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;border:1px solid var(--g4);border-radius:999px;padding:7px 14px;background:var(--w)}
.timer.on{border-color:var(--ink)}
.sum{border:1.5px solid var(--ink);border-radius:var(--r);padding:16px 18px;font-size:13.5px}
.sum .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.sum .h b{font-size:15px}
.sum .h span{font-size:11.5px;color:var(--g2)}
.sum .i{display:grid;grid-template-columns:120px 1fr;gap:0 12px;padding:7px 0;border-bottom:1px solid var(--g4)}
.sum .i:last-child{border:0}
.sum .i b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);padding-top:2px}
.sum .i span{white-space:pre-line}
.sum .i span.miss{color:var(--g3)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.04em;margin:0 4px 4px 0}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--w);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.on{opacity:1}
@media(max-width:620px){
 .grid2,.niches,.niches.three{grid-template-columns:1fr}
 .est{grid-template-columns:1fr 1fr}
 .say{padding-right:14px;padding-bottom:46px}
 .copy{top:auto;bottom:10px}
 .sum .i{grid-template-columns:1fr}
 .sum .i b{margin-top:4px}
 h1{font-size:22px}
}
@media print{.foot,.hbtn,.steps,.meta,.toast{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="brand" id="brand"></div>
 <div class="hbtn">
  <input type="text" id="company" placeholder="Your company" aria-label="Your company" style="width:160px;padding:8px 12px;border-radius:999px">
  <button class="pill" id="lang">ES</button>
  <button class="pill" id="toSum"></button>
  <button class="pill" id="reset"></button>
 </div>
</header>
<div class="steps" id="steps"></div>
<div class="meta"><span id="sname"></span><span id="scount"></span></div>
<main id="main"></main>
</div>
<div class="foot"><div class="in"><button class="pill" id="back"></button><button class="timer" id="timer" title="Start / pause">00:00</button><button class="pill dark" id="next"></button></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= STORAGE ================= */
const KEY="wtguide:v4";
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
S.lang=S.lang||"en";S.step=S.step||0;S.elapsed=S.elapsed||0;S.niche=S.niche||"";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const g=k=>(S[k]??"").toString().trim();
const L=o=>typeof o==="string"?o:(o[S.lang]||o.en);
const pad=n=>String(n).padStart(2,"0");
const localDate=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1300)}

/* ================= UI STRINGS ================= */
const U={
 brand:{en:"Walkthrough & Meeting Guide",es:"Guía de Walkthrough y Reuniones"},
 brandSub:{en:"Prepare · Connect · Ask · Walk · Close",es:"Preparar · Conectar · Preguntar · Recorrer · Cerrar"},
 summary:{en:"Summary",es:"Resumen"},newVisit:{en:"New visit",es:"Nueva visita"},
 back:{en:"← Back",es:"← Atrás"},next:{en:"Next →",es:"Siguiente →"},toSummary:{en:"Summary →",es:"Resumen →"},done:{en:"Done ✓",es:"Listo ✓"},
 you:{en:"You",es:"Tú"},client:{en:"Client",es:"Cliente"},copy:"COPY",copied:"COPIED",
 reveals:{en:"Reveals:",es:"Revela:"},listen:{en:"Listen for:",es:"Escucha por:"},example:{en:"Example:",es:"Ejemplo:"},
 confirmReset:{en:"Start a new visit? All notes will be cleared. Your company name stays.",es:"¿Empezar una nueva visita? Se borran todas las notas. El nombre de tu empresa se queda."},
 cleared:{en:"New visit started",es:"Nueva visita iniciada"},copiedAll:{en:"Summary copied",es:"Resumen copiado"},
 pickNiche:{en:"Pick the meeting type and the client type first",es:"Elige primero el tipo de reunión y de cliente"},
 startTimer:{en:"Start timer",es:"Iniciar cronómetro"},running:{en:"Running",es:"Corriendo"}
};

/* ================= NICHES ================= */
const NICHES={
 office:{name:{en:"Office & commercial",es:"Oficinas y comercial"},tag:{en:"Offices, clinics, retail, facilities. Closes in steps: walkthrough, proposal, review.",es:"Oficinas, clínicas, retail, instalaciones. Se cierra por pasos: walkthrough, propuesta, revisión."},
  know:[["Janitorial",{en:"Recurring cleaning on a set schedule, usually after hours",es:"Limpieza recurrente con horario fijo, normalmente after-hours"}],["Day porter",{en:"Staff on site during business hours for restrooms, lobby, spills",es:"Personal en sitio en horario laboral para baños, lobby, derrames"}],["Scope of work",{en:"Written list of tasks by area and frequency",es:"Lista escrita de tareas por área y frecuencia"}],["Consumables",{en:"Paper, soap, liners: who provides them changes the price",es:"Papel, jabón, bolsas: quién los pone cambia el precio"}],["COI / W-9",{en:"Insurance certificate and tax form most companies require",es:"Certificado de seguro y formulario fiscal que piden casi todas las empresas"}],["High-touch points",{en:"Door handles, switches, rails, counters; key for clinics",es:"Manijas, apagadores, barandales, mostradores; clave en clínicas"}],["Terminal clean",{en:"Full disinfection of a medical room; ask if they need it",es:"Desinfección completa de un cuarto médico; pregunta si lo necesitan"}],["Floor care",{en:"Strip and wax, scrub, burnish; usually quoted separately",es:"Strip and wax, scrub, burnish; normalmente se cotiza aparte"}]],
  ask:["How many nights a week are you running today, and does that include restrooms and break rooms?","Would you want a day porter during business hours, or after-hours only?","Who provides the paper and soap today?","Is there a supervisor walk or quality inspection your team expects?","Are there areas like server rooms or exam rooms with special rules?"],
  quote:{en:"Recurring janitorial 5x/week after 6pm · ~8,000 sq ft, 1 floor, 6 restrooms, 1 break room · VCT worn in hallway, carpet in offices · they supply paper, we bring the rest · key + alarm code · start Oct 1 · condition 3/5 · 12 photos",es:"Janitorial recurrente 5x/semana después de las 6pm · ~8,000 sq ft, 1 piso, 6 baños, 1 cocina · VCT gastado en pasillo, alfombra en oficinas · ellos ponen papel, nosotros lo demás · llave + código de alarma · inicio 1 de oct · condición 3/5 · 12 fotos"},
  services:["Recurring janitorial","Day porter","Initial deep clean","Floor care (strip & wax)","Carpet cleaning","Window cleaning","High-touch disinfection","Restroom program"]},
 pm:{name:{en:"Property management",es:"Property management"},tag:{en:"Apartments, HOAs, multifamily. Turnovers, common areas, one point of contact.",es:"Apartamentos, HOAs, multifamiliar. Turnovers, áreas comunes, un solo contacto."},
  know:[["Turnover / make-ready",{en:"Getting a unit ready for the next resident after move-out",es:"Dejar una unidad lista para el siguiente residente después del move-out"}],["Move-out / move-in clean",{en:"Deep clean of an empty unit: cabinets, appliances, baths, floors",es:"Limpieza profunda de unidad vacía: gabinetes, electrodomésticos, baños, pisos"}],["Unit inspection",{en:"The manager's check before handing over the unit",es:"La revisión del manager antes de entregar la unidad"}],["Common areas / amenities",{en:"Lobby, hallways, gym, pool, clubhouse, laundry",es:"Lobby, pasillos, gimnasio, piscina, clubhouse, lavandería"}],["Work order",{en:"Formal job request inside their system",es:"Solicitud formal de trabajo dentro de su sistema"}],["Vacancy",{en:"Empty units; more vacancy means more turnovers for you",es:"Unidades vacías; más vacancy significa más turnovers para ti"}],["Vendor compliance",{en:"NetVendor, RealPage, Avetta, Compliance Depot. Prequalified is not approved",es:"NetVendor, RealPage, Avetta, Compliance Depot. Precalificado no es aprobado"}],["Portfolio / regional",{en:"Regional managers control several properties; win one, ask for the next",es:"El regional controla varias propiedades; gana una y pide la siguiente"}]],
  ask:["How many turnovers do you average in a month, and what's your make-ready window?","Who issues the work orders, and who approves the invoice?","What does your team check on the unit inspection?","What are residents complaining about most right now?","If it works here, would the same standard apply across the portfolio?"],
  quote:{en:"Turnovers: ~12/month, mostly 1BR and 2BR · 3 day make-ready window · work orders from leasing office, Sarah approves invoices · inspection checks inside oven, fridge, cabinets, baseboards · common areas 3x/week: lobby, 2 halls, gym, laundry · registered in RealPage, need COI · start Nov 1",es:"Turnovers: ~12/mes, mayormente 1 y 2 recámaras · ventana de make-ready de 3 días · work orders desde leasing, Sarah aprueba facturas · inspección revisa horno, refri, gabinetes, zócalos · áreas comunes 3x/semana: lobby, 2 pasillos, gimnasio, lavandería · registrados en RealPage, piden COI · inicio 1 de nov"},
  services:["Unit turnovers","Move-out cleans","Common areas recurring","Carpet cleaning","Window cleaning","Pressure washing","Trash valet areas","Amenity deep clean"]},
 construction:{name:{en:"Post-construction",es:"Post-construcción"},tag:{en:"General contractors and builders. Phases, dates and condition first, price second.",es:"Contratistas y constructoras. Fases, fechas y condición primero, precio después."},
  know:[["Rough clean",{en:"During the build: large debris, sweeping, heavy dust. Can repeat",es:"Durante la obra: escombro grande, barrido, polvo grueso. Puede repetirse"}],["Final clean",{en:"End of build, before handover: every surface in detail, stickers, inside cabinets",es:"Fin de obra, antes de la entrega: todo en detalle, stickers, gabinetes por dentro"}],["Touch-up (fluff) clean",{en:"Right before handover, after punch list: fingerprints and new dust",es:"Justo antes de entregar, después del punch list: huellas y polvo nuevo"}],["Punch list",{en:"Final list of pending items; your touch-up goes after it",es:"Lista final de pendientes; tu touch-up va después"}],["Substantial completion",{en:"Date the project is usable; your final clean window",es:"Fecha en que la obra se puede usar; tu ventana de final clean"}],["CO",{en:"Certificate of occupancy; often needs the cleaning done",es:"Certificado de ocupación; suele requerir la limpieza hecha"}],["Superintendent",{en:"Runs the site day to day; your operating contact",es:"Coordina el sitio día a día; tu contacto operativo"}],["Change order",{en:"Change to the original scope; extra work goes in writing",es:"Cambio al alcance original; el trabajo extra va por escrito"}]],
  ask:["Are we talking rough clean, final clean, or the touch-up after punch list?","What's the substantial completion date you're working toward?","Who's the superintendent I should coordinate with on site?","Is debris removal on us, or is there a dumpster and haul-off already?","Are windows getting sticker and label removal, and is the protective film still on?"],
  quote:{en:"Final clean + touch-up · 12,500 sq ft, 2 floors, 8 restrooms · heavy drywall dust, stickers on 40 windows, film on floors · dumpster on site, debris theirs · super: Mike · substantial completion Nov 14, CO inspection Nov 18 · night work OK · photos taken",es:"Final clean + touch-up · 12,500 sq ft, 2 pisos, 8 baños · mucho polvo de drywall, stickers en 40 ventanas, película en pisos · contenedor en sitio, escombro de ellos · super: Mike · substantial completion 14 nov, inspección CO 18 nov · se puede de noche · fotos tomadas"},
  services:["Rough clean","Final clean","Touch-up clean","Window & sticker removal","Floor scrub & protect","Pressure washing","Debris haul-off","Recurring after handover"]},
 residential:{name:{en:"Residential",es:"Residencial"},tag:{en:"Homes and apartments. Closes on the same visit: recommend, price, book.",es:"Casas y departamentos. Se cierra en la misma visita: recomendar, cotizar, reservar."},
  know:[["Deep clean",{en:"Full reset: detailed baths, kitchen, baseboards, high dusting",es:"Reset completo: baños detallados, cocina, zócalos, polvo alto"}],["Standard / maintenance",{en:"Recurring clean that keeps the home at that level",es:"Limpieza recurrente que mantiene la casa en ese nivel"}],["Move-in / move-out",{en:"Empty home: inside cabinets, oven, fridge; ready for landlord walkthrough",es:"Casa vacía: gabinetes, horno, refri por dentro; lista para el landlord"}],["Recurring",{en:"Weekly, biweekly, monthly. Biweekly is the usual sweet spot",es:"Semanal, quincenal, mensual. Quincenal suele ser el punto ideal"}],["Add-ons",{en:"Inside oven, inside fridge, interior windows, laundry",es:"Horno por dentro, refri por dentro, ventanas interiores, lavandería"}],["Pet hair treatment",{en:"Extra attention on upholstery and floors where pets live",es:"Atención extra en muebles y pisos donde hay mascotas"}]],
  ask:["Tell me a bit about the house and what's going on right now.","Which parts of the house bother you most?","When was the last time it had a real deep clean?","Anything you'd like us to pay special attention to?","Will someone be home, or should we plan on a code or a key?"],
  quote:{en:"Deep clean then biweekly · 3 bed, 2 bath, ~1,800 sq ft · hasn't had a deep clean in a year · 2 dogs, pet hair on couch · wants inside oven + fridge · garage code 4417 · priorities: kitchen, master bath · start next Thursday",es:"Deep clean y luego quincenal · 3 recámaras, 2 baños, ~1,800 sq ft · sin deep clean hace un año · 2 perros, pelo en el sillón · quiere horno + refri por dentro · código de garaje 4417 · prioridades: cocina, baño principal · inicio el próximo jueves"},
  services:["Deep clean","Biweekly recurring","Weekly recurring","Move-out clean","Inside oven & fridge","Interior windows","Pet hair treatment","Post-renovation clean"]}
};
const N=()=>NICHES[S.niche]||NICHES.office;
const fill=t=>t.replace(/\[Company\]/g,g("company")||"[Company]");

/* ================= HELPERS ================= */
const say=(t,who)=>{const tt=fill(t);return `<div class="say ${who==="them"?"them":""}"><span class="who">${L(who==="them"?U.client:U.you)}</span>${esc(tt)}<button class="copy" data-copy="${esc(tt)}">${U.copy}</button></div>`};
const Q=(n,s,r,l)=>`<div style="margin:14px 0"><div class="lab">${n}</div>${say(s)}${r?`<div class="rev"><b>${L(U.reveals)}</b> ${r}</div>`:""}${l?`<div class="rev"><b>${L(U.listen)}</b> ${l}</div>`:""}</div>`;
const CK=(id,items)=>`<div class="ck" data-ck="${id}">${items.map((t,i)=>{const on=(S["ck_"+id]||[]).includes(i);return `<label class="${on?"done":""}"><input type="checkbox" ${on?"checked":""}><span>${t}</span></label>`}).join("")}</div>`;
const NOTE=(id,n,t,ex)=>`<div class="note"><div class="n">${n}</div><b class="t">${t}</b><textarea data-s="${id}" placeholder="${esc(ex)}">${esc(g(id))}</textarea><div class="ex">${L(U.example)} <i>${esc(ex)}</i></div></div>`;
const TABLE=(head,rows)=>`<div class="tscroll"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const ACC=(items)=>items.map(([q,body])=>`<details><summary>${q}</summary><div class="in">${body}</div></details>`).join("");
const es=()=>S.lang==="es";

/* ================= DEEP CONTENT ================= */
const TECH=[
{n:"Layered open questions",ne:"Preguntas abiertas en capas",
 what:{en:"One broad question that invites a story, followed by follow-ups on what they actually said.",es:"Una pregunta amplia que invita a contar una historia, seguida de preguntas sobre lo que realmente dijeron."},
 why:{en:"People defend themselves against interrogations but open up when they tell a story. In one answer they give you the problem, the history, the people involved and the urgency, and they feel heard instead of evaluated.",es:"La gente se defiende de un interrogatorio pero se abre cuando cuenta una historia. En una sola respuesta te da el problema, la historia, las personas involucradas y la urgencia, y se siente escuchada en vez de evaluada."},
 how:{en:["Start with what, how or tell me","Ask one question, then stop talking","Pick the most important word in their answer and ask about it","Repeat back what you understood","Only then ask closed questions for missing facts (sq ft, days, start date)"],es:["Empieza con qué, cómo o cuénteme","Haz una sola pregunta y deja de hablar","Toma la palabra más importante de su respuesta y pregunta por ella","Repite lo que entendiste","Solo entonces haz preguntas cerradas para los datos que faltan (sq ft, días, fecha)"]},
 ex:["Tell me a little about the building and what's happening with the cleaning right now.","You said it's been inconsistent. What does a bad week look like?","Walk me through how a decision like this usually happens here."],
 avoid:{en:"Opening with “How many square feet?” or firing four closed questions in a row.",es:"Abrir con “¿Cuántos pies cuadrados?” o disparar cuatro preguntas cerradas seguidas."}},
{n:"Labeling",ne:"Labeling (etiquetar)",
 what:{en:"Saying out loud the emotion or concern you hear behind their words.",es:"Decir en voz alta la emoción o preocupación que escuchas detrás de sus palabras."},
 why:{en:"When a concern is named, it loses intensity. The client feels understood, lowers their guard and usually corrects or expands it, which gives you more information. It also shows you were listening, which builds trust faster than any credential.",es:"Cuando una preocupación se nombra, pierde intensidad. El cliente se siente entendido, baja la guardia y normalmente la corrige o la amplía, lo que te da más información. También demuestra que escuchaste, y eso genera confianza más rápido que cualquier credencial."},
 how:{en:["Start with “It sounds like…”, “It seems…” or “It looks like…”","Never say “I hear you're saying” or “I understand you feel”","Say it, then stay quiet and let them respond","If you got it wrong, that's fine: they'll correct you and tell you more"],es:["Empieza con “It sounds like…”, “It seems…” o “It looks like…”","Nunca digas “I hear you're saying” o “I understand you feel”","Dilo y quédate callado para que respondan","Si te equivocas no pasa nada: te corrigen y te cuentan más"]},
 ex:["It sounds like consistency is extremely important to your team.","It seems like your biggest concern is not going through another bad experience.","It sounds like you're the one getting the complaints when this goes wrong.","It seems like timing on this project is tighter than anyone expected."],
 avoid:{en:"Labeling with judgment (“It sounds like your current company is terrible”). Label their feeling, not your opinion.",es:"Etiquetar con juicio (“Parece que su empresa actual es terrible”). Etiqueta su sentimiento, no tu opinión."}},
{n:"Mirroring",ne:"Mirroring (espejo)",
 what:{en:"Repeating the last one to three important words they said, with a curious tone, and then staying silent.",es:"Repetir las últimas una a tres palabras importantes que dijeron, con tono de curiosidad, y luego quedarte callado."},
 why:{en:"It invites the person to keep talking without feeling questioned. They naturally explain more and often reveal the detail that matters most: the incident, the cost, the person who complained.",es:"Invita a la persona a seguir hablando sin sentirse interrogada. Naturalmente explica más y muchas veces revela el detalle que más importa: el incidente, el costo, la persona que se quejó."},
 how:{en:["Pick the emotionally loaded word","Repeat it as a soft question","Wait at least four seconds","Use it two or three times per visit, not every sentence"],es:["Elige la palabra con más carga emocional","Repítela como pregunta suave","Espera al menos cuatro segundos","Úsalo dos o tres veces por visita, no en cada frase"]},
 ex:["Client: “We've had a lot of issues with communication.” You: “Communication?”","Client: “They just don't show up on Fridays.” You: “Don't show up on Fridays?”","Client: “The owner walked in and saw it.” You: “The owner saw it?”"],
 avoid:{en:"Mirroring everything like a parrot, or using a flat tone that sounds sarcastic.",es:"Repetir todo como perico, o usar un tono plano que suena sarcástico."}},
{n:"Feel · Felt · Found",ne:"Feel · Felt · Found",
 what:{en:"A three-part answer to objections: acknowledge how they feel, share that others felt the same, and tell what those clients found.",es:"Respuesta en tres partes para objeciones: reconoce cómo se siente, comparte que otros se sintieron igual y cuenta lo que esos clientes descubrieron."},
 why:{en:"It avoids confrontation. Instead of telling the client they're wrong, you put them next to other people who had the same doubt and made a good decision. It turns an argument into a story.",es:"Evita la confrontación. En vez de decirle al cliente que está equivocado, lo pones al lado de otras personas que tuvieron la misma duda y tomaron una buena decisión. Convierte una discusión en una historia."},
 how:{en:["Feel: acknowledge without agreeing it's a deal breaker","Felt: other clients had the same concern","Found: the specific result they got","Close with a question that moves forward"],es:["Feel: reconoce sin aceptar que sea un impedimento","Felt: otros clientes tuvieron la misma preocupación","Found: el resultado concreto que obtuvieron","Cierra con una pregunta que avance"]},
 ex:["I completely understand how you feel. Several property managers felt the same way when they compared us on price. What they found was that one reliable crew meant fewer re-cleans and fewer resident complaints. Can I show you what's included so you're comparing the same thing?","I understand. A lot of owners felt that switching providers would be a hassle. What they found was that we handled the transition in one week without them lifting a finger."],
 avoid:{en:"Using it word for word every time, or inventing results you can't back up.",es:"Usarlo palabra por palabra siempre, o inventar resultados que no puedes respaldar."}},
{n:"Calibrated questions",ne:"Preguntas calibradas",
 what:{en:"How and what questions that put the client in the role of solving the problem with you.",es:"Preguntas de cómo y qué que ponen al cliente en el rol de resolver el problema contigo."},
 why:{en:"They can't be answered with yes or no, they don't sound like pressure, and they make the client think about the solution instead of defending their position.",es:"No se pueden contestar con sí o no, no suenan a presión y hacen que el cliente piense en la solución en vez de defender su postura."},
 how:{en:["Start with how or what, never why (why sounds like an accusation)","Ask them when you face resistance or a stuck decision","Listen to the answer: it's their own plan to say yes"],es:["Empieza con cómo o qué, nunca por qué (por qué suena a acusación)","Úsalas cuando hay resistencia o una decisión trabada","Escucha la respuesta: es su propio plan para decir que sí"]},
 ex:["What would need to happen for this to be an easy decision?","How would you like us to handle it if something isn't right?","What's the biggest challenge you see in making a change right now?","How does this usually get approved on your side?"],
 avoid:{en:"“Why haven't you switched yet?” It puts them on the defensive.",es:"“¿Por qué no han cambiado todavía?” Los pone a la defensiva."}},
{n:"Impact questions",ne:"Preguntas de impacto",
 what:{en:"Questions that make the client put into words what the problem is costing them.",es:"Preguntas que hacen que el cliente ponga en palabras lo que le está costando el problema."},
 why:{en:"Price only feels high when the problem feels small. When the client says out loud the time, complaints and risk the problem creates, your proposal becomes the cheaper option.",es:"El precio solo se siente alto cuando el problema se siente pequeño. Cuando el cliente dice en voz alta el tiempo, las quejas y el riesgo que le genera el problema, tu propuesta se vuelve la opción más barata."},
 how:{en:["Ask after they name a problem, not before","Go for time, money, reputation and stress","Repeat the impact back in your summary"],es:["Pregunta después de que nombren un problema, no antes","Busca tiempo, dinero, reputación y estrés","Repite el impacto en tu resumen"]},
 ex:["How has that affected your team, complaints, extra work, anything like that?","How much time does your office spend chasing the current crew each week?","What happens if a unit isn't ready on move-in day?","What would it mean for you if that were solved?"],
 avoid:{en:"Exaggerating their problem for them. Let them say it.",es:"Exagerar el problema por ellos. Deja que lo digan."}},
{n:"Strategic silence",ne:"Silencio estratégico",
 what:{en:"Staying quiet for four to six seconds after an important question or after saying the price.",es:"Quedarte callado cuatro a seis segundos después de una pregunta importante o después de decir el precio."},
 why:{en:"Silence makes people fill the space, and what they say next is usually the most honest part. After the price, silence shows confidence; talking shows doubt.",es:"El silencio hace que la gente llene el espacio, y lo siguiente que dicen suele ser lo más honesto. Después del precio, el silencio muestra seguridad; hablar muestra duda."},
 how:{en:["Ask, then count to four in your head","Look at your notes or at them, calmly","After the price: say it once and stop","If they stay silent too, ask “What are you thinking?”"],es:["Pregunta y cuenta hasta cuatro en tu mente","Mira tus notas o a la persona, con calma","Después del precio: dilo una vez y detente","Si también se quedan callados, pregunta “What are you thinking?”"]},
 ex:["The investment for the full scope is [rate] per month. [silence]","What made you start looking now? [silence]"],
 avoid:{en:"Filling the pause with discounts or justifications.",es:"Llenar la pausa con descuentos o justificaciones."}},
{n:"Summarize and confirm",ne:"Resumir y confirmar",
 what:{en:"Repeating their situation and priorities in your words before you recommend anything.",es:"Repetir su situación y prioridades con tus palabras antes de recomendar algo."},
 why:{en:"It proves you listened, it lets them correct mistakes before they end up in the proposal, and it creates a series of small yeses that make the final yes natural.",es:"Prueba que escuchaste, les permite corregir errores antes de que lleguen a la propuesta y crea una serie de pequeños síes que hacen natural el sí final."},
 how:{en:["Use their exact words for the problem","List priorities in their order","End with “Did I get that right?”","Then connect each priority to your solution"],es:["Usa sus palabras exactas para el problema","Enumera prioridades en su orden","Termina con “Did I get that right?”","Luego conecta cada prioridad con tu solución"]},
 ex:["Just to make sure I understand: the main issue is missed nights, what matters most is spotless restrooms, and you'd like to start by the 1st. Did I get that right?","So: restrooms, response time, and the same crew, in that order."],
 avoid:{en:"Summarizing in your own sales language instead of their words.",es:"Resumir con tu lenguaje de ventas en vez de sus palabras."}},
{n:"Preempt the objection",ne:"Adelantarte a la objeción",
 what:{en:"Naming the most likely objection before the client does.",es:"Nombrar la objeción más probable antes de que el cliente la diga."},
 why:{en:"When you say it first, it loses its weight and you control how it's framed. It also signals honesty, which is rare in sales.",es:"Cuando la dices primero, pierde peso y tú controlas cómo se plantea. También transmite honestidad, que es rara en ventas."},
 how:{en:["Use it when you're fairly sure the objection is coming","Say it calmly, then explain in one sentence","Move to a question right away"],es:["Úsalo cuando estés casi seguro de que viene la objeción","Dilo con calma y explica en una frase","Pasa a una pregunta de inmediato"]},
 ex:["You might be thinking we'll be more expensive than your current company, and we may be. The difference is in what's included. Can I walk you through it?","You're probably wondering if switching will be a headache. Here's exactly how the first week works."],
 avoid:{en:"Raising objections the client would never have thought of.",es:"Sacar objeciones que el cliente nunca habría pensado."}}
];

{id:"practice",name:{en:"Practice",es:"Práctica"},render:()=>`
 <h1>${es()?"Practica la conversación":"Practice the conversation"}</h1>
 <p class="lead">${es()?"Así suena "+W3(["","",""],["un walkthrough bien hecho","una reunión bien hecha","una llamada bien hecha"])+" con este tipo de cliente. Léelo en voz alta con un compañero antes: uno hace de cliente, el otro de vendedor. Fíjate dónde se usa cada técnica.":"This is how a good "+W3(["walkthrough","meeting","call"],["","",""])+" sounds with this type of client. Read it out loud with a teammate beforehand: one plays the client, the other the rep. Notice where each technique shows up."}</p>
 <div class="card soft"><div class="lab">${L(N().name)} · ${modeName()}</div>${(isWalk()?ND().role:MEET_ROLE).map(([w,t])=>say(t,w)).join("")}</div>
 <h2>${es()?"Qué técnicas aparecieron":"Techniques you just saw"}</h2>
 <ul class="clean"><li><b>${es()?"Pregunta abierta":"Open question"}</b>: ${es()?"“What made you start looking…”, invita a contar la historia.":"“What made you start looking…”, invites the story."}</li><li><b>Mirroring</b>: ${es()?"repetir “Nobody answers?” o “Two?” para que expliquen más.":"repeating “Nobody answers?” or “Two?” so they explain more."}</li><li><b>Labeling</b>: ${es()?"“It sounds like…” nombra lo que sienten.":"“It sounds like…” names what they feel."}</li><li><b>${es()?"Resumen":"Summary"}</b>: ${es()?"sus prioridades en su orden, con sus palabras.":"their priorities, in their order, in their words."}</li><li><b>${es()?"Cierre de dos opciones":"Two-option close"}</b>: ${es()?"nunca termina con una pregunta de sí o no.":"it never ends on a yes or no question."}</li></ul>
 <h2>${es()?"Ejercicios rápidos":"Quick drills"}</h2>
 ${ACC([[es()?"Convierte cerradas en abiertas":"Turn closed into open",`<p>${es()?"Practica transformar estas preguntas:":"Practice turning these around:"}</p>${say("Are you happy with your current company?","them")}${say("How has the current service been working for you?")}${say("Do you have a budget?","them")}${say("How do you normally price this today, and what's included?")}${say("Is next week OK?","them")}${say("Would Tuesday or Thursday work better?")}`],
 [es()?"Responde sin bajar el precio":"Answer without dropping the price",`${say("That's more than we pay now.","them")}${say("I understand. What's included in what you pay now? If we line up the scope, we can see where the difference is, and if the budget is fixed, we can adjust frequency instead of quality.")}`],
 [es()?"Recupera una conversación que se enfría":"Recover a conversation going cold",`${say("I only have five minutes.","them")}${say(isWalk()?"Then let's make them count. What made you start looking, and which two areas matter most? We'll walk those, and I'll have the proposal to you by Thursday.":"Then let's make them count. What made you start looking, and what matters most to you? Let's book a time for me to see the space so the rest of the conversation is about your building, not a guess.")}`]])}`},

{id:"connect",name:{en:"Connect",es:"Conectar"},render:()=>`
 <h1>${W3(["The first two minutes decide the visit","The first two minutes decide the meeting","The first two minutes decide the call"],["Los primeros dos minutos deciden la visita","Los primeros dos minutos deciden la reunión","Los primeros dos minutos deciden la llamada"])}</h1>
 <p class="lead">${es()?"La gente le compra a quien le tiene confianza. Antes de cualquier pregunta sobre limpieza, conecta.":"People buy from people they trust. Before any question about cleaning, connect."}</p>
 <div class="card dark" id="tbox"><div class="lab">${es()?"Cronómetro":"Timer"}</div>${W3(["Start it when you walk in. Target: 15 to 17 minutes. ","Start it when you sit down. Keep to the time you agreed, usually 30 minutes. ","Start it when the call connects. Keep to the time you agreed, usually 20 to 30 minutes. "],["Inícialo al entrar. Meta: 15 a 17 minutos. ","Inícialo al sentarte. Respeta el tiempo acordado, normalmente 30 minutos. ","Inícialo cuando conecte la llamada. Respeta el tiempo acordado, normalmente 20 a 30 minutos. "])}</div>
 ${TABLE([es()?"Movimiento":"Move",es()?"Cómo":"How"],es()?[["Nota algo real",W3(["","",""],["El edificio, un letrero, un premio, lo ocupado que está. Una observación genuina, nunca halagos","Su oficina, algo en la pared, un premio, cómo está el equipo. Una observación genuina, nunca halagos","Algo de su sitio web, LinkedIn o una noticia reciente. Una observación genuina, nunca halagos"])],["Usa su nombre",S.mode==="call"?"Un poco más que en persona: al saludar, al resumir y al cerrar":"Una vez al saludar, otra al cerrar"],["Iguala su ritmo","Directo: ve al punto. Conversador: deja respirar la charla un minuto"],["Agradece el tiempo","Dilo en serio: el tiempo que te dieron es toda la reunión"],["Explica por qué preguntas","Para que se sienta como asesoría, no como un discurso de ventas"]]:[["Notice something real",W3(["The building, a sign, an award, how busy it is. One genuine observation, never flattery","Their office, something on the wall, an award, how the team seems. One genuine observation, never flattery","Something from their website, LinkedIn or recent news. One genuine observation, never flattery"],["","",""])],["Use their name",S.mode==="call"?"A little more than in person: when you greet, when you summarize, when you close":"Once when you meet, once when you close"],["Match their pace","Direct: get to the point. Warm: let the small talk breathe for a minute"],["Thank the time","Mean it: the time they gave you is the whole meeting"],["Explain why you'll ask","So it feels like a consultation, not a sales pitch"]])}
 ${!isWalk()?`<h2>${es()?"Abre con un acuerdo inicial":"Open with an upfront agenda"}</h2><div class="card soft"><div class="lab">${es()?"Por qué funciona":"Why it works"}</div>${L(AGENDA.why)}</div><ol style="padding-left:20px">${L(AGENDA.how).map(x=>`<li style="margin:3px 0">${x}</li>`).join("")}</ol>${AGENDA.ex.map(x=>say(x)).join("")}`:""}
 <h2>${es()?"Di esto":"Say this"}</h2>
 ${say("Hi [Name], thank you for taking the time today. I know it's limited, so I'll make it count.")}
 ${say(W3(["This lobby is beautiful. How long have you been in this building?","Thanks for having me here. How long has the team been in this office?","I was looking at your website before the call. Congratulations on the new location, how's that going?"],["This lobby is beautiful. How long have you been in this building?","Thanks for having me here. How long has the team been in this office?","I was looking at your website before the call. Congratulations on the new location, how's that going?"]))}
 ${isWalk()?say("I'm with [Company]. Before we walk the facility, I'd like a few minutes to understand your business and what's most important to you. Every property runs differently, so rather than a standard presentation, I'd rather learn your goals. Then, as we walk, we focus on what matters to you."):say("I'm with [Company]. Rather than a standard presentation, I'd like to spend most of our time learning about your experience and what matters to your team. That way anything I suggest is built around you.")}
 <h2>${es()?"Conoce a la persona":"Get to know the person"}</h2>
 ${Q("Question 1","So, what's your role here, and how long have you been with the company?",es()?"Autoridad y antigüedad sin preguntar si decide.":"Authority and tenure without asking if they decide.",es()?"“I make that call” = autoridad alta · “I'd have to run it by…” = compartida.":"“I make that call” = high authority · “I'd have to run it by…” = shared.")}
 ${Q("Question 2","Before we dive in, is it just you I'll be talking to about this, or is there anyone else who should be part of the conversation?",es()?"Otros decisores sin sonar a interrogatorio.":"Other decision makers without sounding like an interrogation.","")}
 ${NOTE("n1",es()?"Nota 1 de 5":"Note 1 of 5",es()?"Información del cliente":"Client info",es()?"Dana Smith, ops manager 6 años, decide con el dueño Mike. Directa, ocupada. Referida por Riverside PM.":"Dana Smith, ops manager 6 yrs, decides with owner Mike. Direct, busy. Referral from Riverside PM.")}`},

{id:"ask",name:{en:"Ask",es:"Preguntar"},render:()=>`
 <h1>${es()?"Deja que cuenten la historia":"Let them tell the story"}</h1>
 <p class="lead">${es()?"Abiertas primero. Profundiza en lo que dicen, repítelo con tus palabras, y usa preguntas cerradas solo para llenar lo que falta.":"Open questions first. Dig into what they say, repeat it back, and use closed questions only to fill what's missing."}</p>
 <div class="grid2"><div class="card soft"><div class="lab">${es()?"Evita (cerradas, una tras otra)":"Avoid (closed, one after another)"}</div><ul class="clean"><li>What's your budget?</li><li>Who makes the final decision?</li><li>When do you want to start?</li><li>Are you talking to other companies?</li></ul></div>
 <div class="card"><div class="lab">${es()?"Usa (una abierta que cubre todo)":"Use (one open question that covers it all)"}</div>Walk me through how a decision like this usually happens here, who's involved, and what's the timeline?<p class="hint" style="margin:8px 0 0">${es()?"Una respuesta te da decisor, presupuesto, fecha y urgencia.":"One answer gives you decision maker, budget, date and urgency."}</p></div></div>
 ${Q("Question 3 · why now","What made you decide to start looking at other options now?",es()?"El motivo real, la frustración y una fecha límite escondida.":"The real reason, the frustration, and a hidden deadline.",es()?"Suele ser la respuesta más larga y honesta. No interrumpas.":"Usually the longest, most honest answer. Don't interrupt.")}
 <details><summary>${es()?"Profundiza un nivel":"Go one level deeper"}</summary><div class="in">${say("How often has that been happening?")}${say("How has that affected your team, complaints, extra work, anything like that?")}${say("What would it mean for you if that were solved?")}</div></details>
 ${NOTE("n2",es()?"Nota 2 de 5":"Note 2 of 5",es()?"Por qué buscan / qué pasó con el proveedor anterior":"Why they're looking / what happened with the previous provider",es()?"El proveedor falta 1 o 2 noches por semana hace 3 meses, no contesta. Mes a mes. Dos quejas de pacientes por los baños.":"Provider missing 1 to 2 nights a week for 3 months, no answer when they call. Month to month. Two patient complaints about restrooms.")}
 ${Q("Question 4 · magic wand","If you could fix three things about how your space is cleaned today, what would they be?",es()?"Una lista priorizada.":"A prioritized list.",es()?"Las dos primeras cierran la venta. El orden importa.":"The first two close the sale. The order matters.")}
 ${Q("Question 5 · partnership","What would a great partnership with a cleaning company look like for you, day to day?",es()?"Comunicación, reportes y el estándar real.":"Communication, reporting, and the real standard.",es()?"“Reportes”, “fotos”, “un contacto”: eso va en la propuesta.":"“Reports”, “photos”, “one contact”: that goes in the proposal.")}
 ${Q("Question 6 · decision","Walk me through how a decision like this usually happens here.",es()?"Decisores, presupuesto, cronograma.":"Decision makers, budget, timeline.",es()?"Fechas dichas de pasada suelen ser el plazo real.":"Dates mentioned in passing are usually the real deadline.")}
 ${Q("Question 7 · anything else","Anything else going on, upcoming events, inspections, or other locations?",es()?"Expansión y servicios adicionales.":"Expansion and extra services.","")}
 <h2>${es()?"Preguntas del nicho":"Niche questions"}: ${L(N().name)}</h2>
 ${N().ask.map(a=>say(a)).join("")}
 <h2>${es()?"Experiencia y alianza":"Experience and partnership"}</h2>
 <div class="card dark"><div class="lab">${es()?"La pregunta que define la relación":"The question that defines the relationship"}</div>If you found a cleaning partner you'd keep for the next ten years, what would they be doing that others haven't?<p class="hint" style="margin:8px 0 0">${es()?"Lo que respondan es tu propuesta. Escríbelo con sus palabras y repítelo al cerrar.":"Whatever they answer is your proposal. Write it in their words and repeat it when you close."}</p></div>
 ${partnerHTML()}
 <h2>${es()?"Banco de preguntas por categoría":"Question bank by category"}</h2>
 ${ACC(QBANK.map(c=>[L(c.c),`<p class="hint" style="margin:0 0 6px">${L(c.w)}</p>${c.q.map(x=>say(x)).join("")}`]))}

 ${[0,2,5,6,7].map(i=>techHTML(TECH[i])).join("")}
 <h2>${es()?"Escucha activa":"Active listening"}</h2>
 <div class="card soft"><ul class="clean"><li><b>${es()?"Refleja":"Reflect"}:</b> “It sounds like consistency is the real issue here.”</li><li><b>${es()?"Resume":"Summarize"}:</b> “So: restrooms, response time, and the same crew, in that order. Did I get that right?”</li><li><b>${es()?"Aclara":"Clarify"}:</b> “When you say inconsistent, what does a bad week look like?”</li><li><b>${es()?"Silencio":"Silence"}:</b> ${es()?"pregunta y cuenta hasta cuatro.":"ask, then count to four."}</li></ul></div>

 ${estHTML()}
 ${NOTE("n4",es()?"Nota 4 de 5":"Note 4 of 5",es()?"Detalles del servicio que quieren":"Details of the service they want",L(N().quote))}
 <div class="card soft"><div class="lab">${es()?"Durante el recorrido":"While walking"}</div>${es()?"Camina a su ritmo. Cuando señalen un problema, refléjalo: “So this is one of the areas that's been frustrating.” Nunca critiques al proveedor actual; las fotos hablan solas. No prometas nada que operaciones no haya aprobado.":"Walk at their pace. When they point at a problem, reflect it: “So this is one of the areas that's been frustrating.” Never criticize the current provider; the photos speak. Promise nothing operations hasn't approved."}</div>`},

{id:"objections",name:{en:"Objections",es:"Objeciones"},render:()=>`
 <h1>${es()?"Cómo responder sin discutir":"How to respond without arguing"}</h1>
 <p class="lead">${es()?"Una objeción es una petición de más información. Escucha, entiende con una pregunta, responde con calma, confirma que quedó resuelta y avanza.":"An objection is a request for more information. Listen, understand with a question, respond calmly, confirm it's resolved, and move forward."}</p>
 <div class="card dark"><div class="lab">${es()?"La secuencia":"The sequence"}</div>${es()?"Escucha sin interrumpir · Entiende con una pregunta (“Can you tell me a little more about that?”) · Responde · Confirma (“Does that answer your question?”) · Avanza con dos opciones":"Listen without interrupting · Understand with a question (“Can you tell me a little more about that?”) · Respond · Confirm (“Does that answer your question?”) · Move forward with two options"}</div>
 <h2>${es()?"Técnicas avanzadas":"Advanced techniques"}</h2>
 ${[3,1,4,8].map(i=>techHTML(TECH[i])).join("")}
 <h2>${es()?"Objeciones":"Objections"} (${objsFor().length})</h2>
 ${objsFor().map(objHTML).join("")}
 <div class="card soft"><div class="lab">${es()?"Nunca":"Never"}</div>${es()?"Discutir · criticar al proveedor actual · bajar la tarifa para resolverla (reduce el alcance) · asumir que desapareció. Pregunta: “Does that answer your question?”":"Argue · criticize the current provider · drop the rate to fix it (reduce the scope instead) · assume it went away. Ask: “Does that answer your question?”"}</div>`},

{id:"close",name:{en:"Close",es:"Cerrar"},render:()=>`
 <h1>${es()?"Sal con un resultado, siempre":"Leave with a result, always"}</h1>
 <p class="lead">${W3(["Close on site if the scope is clear and you have approved pricing. If not, leave with two dates. If it's not the moment, leave with the seed of a future sale.","The goal of this meeting is the walkthrough on their calendar, with a date and a time. If they're ready and the scope is simple, you can close today. If it's not the moment, leave with the renewal date and permission to come back.","The goal of this call is the walkthrough on their calendar, with a date and a time, and a recap email within the hour. If it's not the moment, end with the renewal date and permission to follow up."],["Cierra en sitio si el alcance está claro y tienes tarifa aprobada. Si no, sal con dos fechas. Si no es el momento, sal con la semilla de una venta futura.","El objetivo de esta reunión es el walkthrough en su calendario, con día y hora. Si están listos y el alcance es simple, puedes cerrar hoy. Si no es el momento, sal con la fecha de renovación y permiso para volver.","El objetivo de esta llamada es el walkthrough en su calendario, con día y hora, y un resumen por email dentro de una hora. Si no es el momento, termina con la fecha de renovación y permiso para dar seguimiento."])}</p>
 <h2>${es()?"Señales de que están listos":"Signs they're ready"}</h2>
 <div class="card soft">${es()?"Preguntan cuándo pueden empezar, qué documentos necesitas, si trabajas de noche, si estás asegurado, qué pasa si necesitan algo extra. Cuando oigas esto, deja de presentar y cierra.":"They ask when you can start, what documents you need, if you work nights, if you're insured, what happens if they need something extra. When you hear this, stop presenting and close."}</div>
 <h2>${es()?"Cierres":"Closes"}</h2>
 ${CLOSES.map(closeHTML).join("")}
 <h2>${es()?"Di esto":"Say this"}</h2>
 ${!isWalk()?say("This was really helpful. You told me consistency, a real point of contact, and follow-through matter most. Let me come see the space so I can show you exactly how we'd deliver that. Would Tuesday or Thursday work better?"):""}
 ${!isWalk()?"":S.niche==="residential"?say("Based on everything we've seen, here's what I'd recommend. We have Thursday at 9 or Saturday at 1. Which works better for you?"):say("This has been really helpful. I'll put together a proposal based on exactly what you shared and have it to you by [day]. Would [day/time] or [day/time] work better to go over it together?")}
 ${say("And if you know another manager dealing with the same issues, we'd love an introduction. No pressure at all.")}
 <h2>${es()?"Dos servicios para ofrecer":"Two services to offer"}</h2>
 <p class="hint">${es()?"Elige los dos que resuelven lo que nombraron o lo que viste.":"Pick the two that solve what they named or what you saw."}</p>
 <div class="chips" id="svc">${N().services.map(s=>`<button class="chip ${(S.svc||[]).includes(s)?"on":""}" data-sv="${esc(s)}">${esc(s)}</button>`).join("")}</div>
 <div class="field"><input type="text" data-s="svc_other" value="${esc(g("svc_other"))}" placeholder="${es()?"Otro o detalle":"Other or detail"}"></div>
 <h2>${es()?"Resultado":"Outcome"}</h2>
 <div class="chips" data-c="outcome">${[["Closed on site","Cerrado en sitio"],["Proposal + review set","Propuesta + revisión agendada"],["Follow-up date set","Fecha de seguimiento"],["Not now, renewal noted","No por ahora, renovación anotada"]].map(([e,s])=>`<button class="chip ${g("outcome")===e?"on":""}" data-v="${e}">${es()?s:e}</button>`).join("")}</div>
 ${NOTE("n5",es()?"Nota 5 de 5":"Note 5 of 5",es()?"Notas generales de la oportunidad":"General notes about the opportunity",es()?"Propuesta el jueves, revisión viernes 2pm con Dana y Mike. Objeción: precio, comparan 3 noches contra 5. Prometido: reporte semanal con fotos. Segunda clínica en primavera.":"Proposal Thursday, review Friday 2pm with Dana and Mike. Objection: price, comparing 3 nights vs 5. Promised: weekly photo report. Second clinic opening in spring.")}
 <div class="card dark"><div class="lab">${W3(["Never leave without","Never end without","Never hang up without"],["Nunca salgas sin","Nunca termines sin","Nunca cuelgues sin"])}</div>${isWalk()?(es()?"Fecha de propuesta · fecha de revisión · quién decide · alcance completo · permiso para volver si no es ahora":"Proposal date · review date · who decides · complete scope · permission to come back if not now"):(es()?"Walkthrough agendado con día y hora · quién decide · su definición de un buen socio · permiso para volver si no es ahora":"Walkthrough booked with day and time · who decides · their definition of a great partner · permission to come back if not now")}</div>`},

{id:"summary",name:{en:"Summary",es:"Resumen"},render:()=>{
 const sv=[...(S.svc||[]),g("svc_other")].filter(Boolean).join(" · ");
 const it=(k,l)=>`<div class="i"><b>${l}</b><span class="${g(k)?"":"miss"}">${esc(g(k)||"—")}</span></div>`;
 const oc=g("outcome");const ocL=oc?(es()?({"Closed on site":"Cerrado en sitio","Proposal + review set":"Propuesta + revisión agendada","Follow-up date set":"Fecha de seguimiento","Not now, renewal noted":"No por ahora, renovación anotada"}[oc]):oc):"";
 return `<h1>${W3(["Visit summary","Meeting summary","Call summary"],["Resumen de la visita","Resumen de la reunión","Resumen de la llamada"])}</h1>
 <p class="lead">${es()?"Una captura de pantalla. Envíala a quien prepara la propuesta.":"One screenshot. Send it to whoever writes the proposal."}</p>
 <div style="margin-bottom:12px"><button class="pill dark" id="cpSum">${es()?"Copiar como texto":"Copy as text"}</button></div>
 <div class="sum"><div class="h"><b>${esc(g("company")||"Walkthrough")}</b><span>${localDate()} · ${fmt(S.elapsed)} · ${esc(S.mode?modeName():"")} · ${esc(S.niche?L(N().name):"")}</span></div>
 <div style="margin-bottom:6px">${oc?`<span class="tag">${esc(ocL)}</span>`:`<span class="tag" style="border-style:dashed">${es()?"Sin resultado":"Outcome not set"}</span>`}</div>
 ${it("n1",es()?"Cliente":"Client")}${it("n2",es()?"Por qué buscan":"Why looking")}${it("n3",es()?"Prioridades":"Priorities")}${it("n4",es()?"Servicio":"Service wanted")}
 <div class="i"><b>${es()?"Ofrecer":"Offer"}</b><span class="${sv?"":"miss"}">${esc(sv||"—")}</span></div>${it("n5",es()?"Notas":"Notes")}</div>`}}
];

function summaryText(){const sv=[...(S.svc||[]),g("svc_other")].filter(Boolean).join(" · ");const T=(e,s)=>es()?s:e;
 return [`${g("company")||"WALKTHROUGH"} · ${localDate()} · ${fmt(S.elapsed)} · ${S.mode?modeName():""} · ${S.niche?L(N().name):""}`,`${T("OUTCOME","RESULTADO")}: ${g("outcome")||"—"}`,"",`${T("CLIENT","CLIENTE")}: ${g("n1")||"—"}`,"",`${T("WHY LOOKING","POR QUÉ BUSCAN")}: ${g("n2")||"—"}`,"",`${T("PRIORITIES","PRIORIDADES")}: ${g("n3")||"—"}`,"",`${T("SERVICE WANTED","SERVICIO")}: ${g("n4")||"—"}`,"",`${T("OFFER","OFRECER")}: ${sv||"—"}`,"",`${T("NOTES","NOTAS")}: ${g("n5")||"—"}`].join("\n")}

/* ================= TIMER ================= */
let running=false,last=0,tick=null;
const fmt=ms=>{const t=Math.floor((ms||0)/1000);return pad(Math.floor(t/60))+":"+pad(t%60)};
function updTimer(){const el=$("#timer");el.textContent=(running?"● ":"")+fmt(S.elapsed);el.classList.toggle("on",running)}
function startTimer(){if(running)return;running=true;last=Date.now();tick=setInterval(()=>{const n=Date.now();S.elapsed+=n-last;last=n;save();updTimer()},500);updTimer()}
function stopTimer(){running=false;clearInterval(tick);updTimer()}
$("#timer").onclick=()=>running?stopTimer():startTimer();

/* ================= RENDER ================= */
async function copyTxt(t){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(x){}ta.remove()}}
function render(){
 const st=STEPS[S.step];
 $("#brand").innerHTML=`${L(U.brand)}<small>${S.mode?W3(["Prepare · Connect · Ask · Walk · Close","Prepare · Connect · Ask · Scope · Close","Prepare · Connect · Ask · Scope · Close"],["Preparar · Conectar · Preguntar · Recorrer · Cerrar","Preparar · Conectar · Preguntar · Alcance · Cerrar","Preparar · Conectar · Preguntar · Alcance · Cerrar"]):L(U.brandSub)}</small>`;
 $("#lang").textContent=es()?"EN":"ES";$("#toSum").textContent=L(U.summary);$("#reset").textContent=L(U.newVisit);
 $("#company").placeholder=es()?"Tu empresa":"Your company";
 $("#steps").innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${i<S.step?"done":""} ${i===S.step?"on":""}" title="${stepName(s)}" aria-label="${stepName(s)}"></button>`).join("");
 $("#sname").textContent=`${S.step+1} · ${stepName(st)}`;$("#scount").textContent=`${S.step+1} / ${STEPS.length}`;
 $("#main").innerHTML=st.render();
 $("#back").textContent=L(U.back);$("#back").style.visibility=S.step?"visible":"hidden";
 $("#next").textContent=S.step===STEPS.length-1?L(U.done):(S.step===STEPS.length-2?L(U.toSummary):L(U.next));
 if(st.id==="connect"){const b=document.createElement("button");b.className="pill";b.style.marginLeft="6px";b.textContent=L(running?U.running:U.startTimer);b.onclick=()=>{startTimer();b.textContent=L(U.running)};$("#tbox").appendChild(b)}
 if(st.id==="summary"){$("#cpSum").onclick=async()=>{await copyTxt(summaryText());toast(L(U.copiedAll))};if(running)stopTimer()}
 window.scrollTo(0,0);save();
}
function recalcEst(){const o=$("#estOut");if(!o)return;const r=rates();
 if(S.niche==="construction"){const sq=+g("e_sq")||0;let lo=0,hi=0;(S.e_ph||["final"]).forEach(p=>{lo+=sq*r[p][0];hi+=sq*r[p][1]});o.textContent=sq?`$${Math.round(lo).toLocaleString()} – $${Math.round(hi).toLocaleString()}`:"—"}
 if(S.niche==="pm"){const u=+g("e_units")||0;o.textContent=u?`$${(u*r.unit[0]).toLocaleString()} – $${(u*r.unit[1]).toLocaleString()}`:"—"}}

document.addEventListener("click",async e=>{
 const c=e.target.closest(".copy");if(c){await copyTxt(c.dataset.copy);c.textContent=U.copied;c.classList.add("ok");setTimeout(()=>{c.textContent=U.copy;c.classList.remove("ok")},1200);return}
 const mo=e.target.closest("[data-mode]");if(mo){S.mode=mo.dataset.mode;save();render();return}
 const ni=e.target.closest("[data-niche]");if(ni){S.niche=ni.dataset.niche;S.svc=[];save();$$(".niche").forEach(b=>b.classList.toggle("on",b===ni));return}
 const sv=e.target.closest("[data-sv]");if(sv){const v=sv.dataset.sv;S.svc=S.svc||[];if(S.svc.includes(v))S.svc=S.svc.filter(x=>x!==v);else{if(S.svc.length>=2)S.svc.shift();S.svc.push(v)}save();$$("[data-sv]").forEach(b=>b.classList.toggle("on",S.svc.includes(b.dataset.sv)));return}
 const ph=e.target.closest("[data-ph]");if(ph){const p=ph.dataset.ph;S.e_ph=S.e_ph||["final"];if(S.e_ph.includes(p)){if(S.e_ph.length>1)S.e_ph=S.e_ph.filter(x=>x!==p)}else S.e_ph.push(p);save();$$("[data-ph]").forEach(b=>b.classList.toggle("on",S.e_ph.includes(b.dataset.ph)));recalcEst();return}
 const ch=e.target.closest("[data-c] .chip");if(ch){S[ch.parentElement.dataset.c]=ch.dataset.v;save();ch.parentElement.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===ch));return}
 const sb=e.target.closest("#steps button");if(sb){S.step=+sb.dataset.i;render()}
});
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="company"){S.company=el.value;save();$$(".say").forEach(x=>{});return}
 if(el.dataset.s){S[el.dataset.s]=el.value;save();recalcEst();return}
 if(el.dataset.rate){const[k,i]=el.dataset.rate.split(":");S.rates=S.rates||{};const cur=(S.rates[k]||DEF_RATES[k]).slice();cur[+i]=parseFloat(el.value)||0;S.rates[k]=cur;save();recalcEst()}
});
document.addEventListener("change",e=>{
 if(e.target.id==="company"){render();return}
 const ck=e.target.closest(".ck");if(!ck||!e.target.matches("input"))return;
 S["ck_"+ck.dataset.ck]=[...ck.querySelectorAll("input")].map((x,i)=>x.checked?i:-1).filter(i=>i>=0);save();
 ck.querySelectorAll("label").forEach(l=>l.classList.toggle("done",l.querySelector("input").checked));
});
$("#next").onclick=()=>{if(S.step===0&&(!S.niche||!S.mode)){toast(L(U.pickNiche));return}if(S.step<STEPS.length-1){S.step++;render()}};
$("#back").onclick=()=>{if(S.step>0){S.step--;render()}};
$("#toSum").onclick=()=>{S.step=STEPS.length-1;render()};
$("#lang").onclick=()=>{S.lang=es()?"en":"es";save();render()};
$("#reset").onclick=()=>{if(!confirm(L(U.confirmReset)))return;stopTimer();S={company:S.company,lang:S.lang,rates:S.rates,step:0,elapsed:0,niche:"",mode:""};save();render();toast(L(U.cleared))};
$("#company").value=g("company");
render();updTimer();
</script>
</body>
</html>
